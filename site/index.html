<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>准时 / Zhunshi</title>
<style>
  :root { --bg: #f6f6f3; --text: #23281f; --muted: #6b7264; --accent: #2f6f4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171a15; --text: #edeee8; --muted: #9aa192; --accent: #7fbf9f; }
  }
  body {
    margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
    display: grid; place-items: center; text-align: center;
    font: 17px/1.8 -apple-system, "PingFang SC", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  main { padding: 2rem 1.25rem; }
  h1 { font-size: 2.2rem; letter-spacing: .35em; margin: 0; text-indent: .35em; }
  .en { color: var(--muted); letter-spacing: .1em; margin: .2rem 0 1rem; }
  p { color: var(--muted); max-width: 26rem; margin: 0 auto 1.8rem; }
  a { color: var(--accent); text-decoration: none; margin: 0 .8rem; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>准时</h1>
  <div class="en">ZHUNSHI</div>
  <p>把任何具有时间结构的经验，变成可运行、可分享的时间流程。<br>
  Turn time-structured know-how into runnable, shareable flows.</p>
  <nav>
    <a href="/privacy/">隐私政策 · Privacy Policy</a>
    <a href="https://github.com/mingzhangyang/flow">GitHub</a>
  </nav>
</main>
</body>
</html>
