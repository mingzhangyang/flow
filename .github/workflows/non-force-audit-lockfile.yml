name: one-shot non-force audit lockfile closure

on:
  push:
    branches:
      - release/v1-readiness-closure
    paths:
      - .github/workflows/non-force-audit-lockfile.yml

permissions:
  contents: write

jobs:
  close-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1-readiness-closure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current graph
        run: npm ci

      - name: Apply non-force lockfile-only audit fixes
        shell: bash
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          # The safe audit update advances Expo within package.json's existing ~57.0.26 range.
          # Keep Expo's own package map coherent without widening/changing any root semver range.
          npm update expo-notifications --package-lock-only --ignore-scripts
          git diff --exit-code -- package.json

      - name: Verify audited result
        shell: bash
        run: |
          npm audit --package-lock-only --json > /tmp/audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log('audit after non-force fix:', JSON.stringify(v));

          if (v.total !== 22 || v.high !== 15 || v.moderate !== 7 || v.critical !== 0) {
            throw new Error('expected audited closure to remain exactly 22 = 15 high + 7 moderate, 0 critical');
          }

          const expected = {
            'expo': '57.0.27',
            'expo-notifications': '57.0.22',
            'brace-expansion': '5.0.12',
            'braces': '3.0.3',
            'node-forge': '1.4.0',
            'uuid': '7.0.3',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = lock.packages?.['node_modules/' + name]?.version;
            console.log(name, actual);
            if (actual !== version) throw new Error(name + ': expected ' + version + ', got ' + actual);
          }
          NODE

      - name: Reinstall from closed lockfile
        run: npm ci

      - name: Verify Expo dependency contract
        run: |
          npx expo install --check
          npx expo-doctor@latest

      - name: Run repository checks
        run: npm run check

      - name: Run UI regression
        run: npm run test:e2e

      - name: Verify production bundle reachability
        shell: bash
        run: |
          npx expo export --platform android --source-maps --output-dir dist-audit
          for p in brace-expansion braces node-forge uuid micromatch metro xcode; do
            if grep -R -F -q "node_modules/$p/" dist-audit; then
              echo "unexpected runtime reachability: $p"
              exit 1
            fi
            echo "$p ABSENT"
          done

      - name: Commit verified lockfile and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/non-force-audit-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/non-force-audit-lockfile.yml
          git diff --cached --stat
          git commit -m "chore(deps): apply verified non-force audit lockfile fixes"
          git push origin HEAD:release/v1-readiness-closure
