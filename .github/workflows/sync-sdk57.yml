name: one-shot SDK 57 alignment

on:
  push:
    branches:
      - release/v1-readiness-closure
    paths:
      - .github/workflows/sync-sdk57.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1-readiness-closure
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align SDK 57 patches
        run: |
          npm install expo@~57.0.26
          npx expo install --fix
          npx expo install --check
          npx expo-doctor@latest
      - name: Commit aligned dependency graph and remove this workflow
        run: |
          rm .github/workflows/sync-sdk57.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/sync-sdk57.yml
          if git diff --cached --quiet; then
            echo "No dependency changes needed."
            exit 0
          fi
          git commit -m "chore(deps): align current Expo SDK 57 patches [sdk-sync]"
          git push origin HEAD:release/v1-readiness-closure
