name: android-apk-smoke

on:
  push:
    branches:
      - build/android-apk-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Remove iOS-only metadata leaked into Android resources
        shell: bash
        run: |
          set -euo pipefail
          for file in android/app/src/main/res/values-b+*/strings.xml; do
            [ -f "$file" ] || continue
            sed -i '/name="CFBundleDisplayName"/d' "$file"
          done
          if grep -R 'name="CFBundleDisplayName"' android/app/src/main/res/values-b+* 2>/dev/null; then
            echo "CFBundleDisplayName still present in Android localized resources"
            exit 1
          fi

      - name: Verify Android release lint
        working-directory: android
        run: ./gradlew lintRelease --no-daemon --stacktrace

      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-android-standalone-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
