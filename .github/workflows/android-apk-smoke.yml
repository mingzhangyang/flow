name: android-apk-smoke

on:
  push:
    branches:
      - build/android-apk-smoke
      # PR #16 scoped one-time native validation; no EAS auto-build.
      - fix/mobile-ux-release-verification
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build standalone test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Expo release preflight
        run: |
          npx expo install --check
          npx expo-doctor@latest

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      # Validate clean Expo generation; never hide a leaked iOS key using sed.
      - name: Assert native Android resource contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="app_name"' android/app/src/main/res/values/strings.xml
          if grep -R 'name="CFBundleDisplayName"' android/app/src/main/res/values*; then
            echo "::error::iOS-only metadata leaked into Android. Fix Expo source config."
            exit 1
          fi

      - name: Verify Android release lint
        working-directory: android
        run: ./gradlew lintRelease --no-daemon --stacktrace

      - name: Build standalone test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Record APK source and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-artifact
          cp android/app/build/outputs/apk/release/app-release.apk apk-artifact/flow-android-standalone-test.apk
          test -s apk-artifact/flow-android-standalone-test.apk
          printf '%s\n' "$GITHUB_SHA" > apk-artifact/source-commit.txt
          (cd apk-artifact && sha256sum flow-android-standalone-test.apk > SHA256SUMS)
          SIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$SIGNER" ]; then
            if "$SIGNER" verify --print-certs apk-artifact/flow-android-standalone-test.apk > apk-artifact/signature.txt 2>&1; then
              echo "Verified APK signature; this is not proof of EAS release signing." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK signature not verified; check signature.txt." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "No apksigner available: signature unverified." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: flow-android-standalone-test-apk (download ZIP and extract APK)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flow-android-standalone-test-apk
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 7
