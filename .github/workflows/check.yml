# CI：每次 push / PR 跑完整检查（版本闸门 + 双 typecheck + lint + 全部契约/黄金测试），
# 外加 UI 回归（e2e：expo export 的 web 构建 + Playwright 驱动 Chrome 走真实界面）。
# 与本地命令完全一致（npm run check / npm run test:e2e）——CI 不引入本地没有的行为（C10 的工程面）。
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest # 运行器预装 Chrome，e2e/harness.ts 会自动选中
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium's Linux image otherwise renders zh/zh-Hant as missing-glyph boxes;
      # screenshots need readable CJK fonts to be useful as visual evidence.
      - name: Install CJK screenshot fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - run: npm run test:e2e
      # The static web build already exists from test:e2e: no duplicate export.
      - name: Mobile screenshot smoke
        run: npm run shots:smoke
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-mobile-screenshots
          path: shots/smoke/
          if-no-files-found: warn
          retention-days: 7
