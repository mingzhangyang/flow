# 发布 site/（隐私政策等公开页面）到 GitHub Pages。
# 一次性前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 之后 main 分支上 site/ 的任何变更都会自动部署到
# https://mingzhangyang.github.io/flow/ （隐私政策在 /privacy/）。
name: pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
